name: Create draft release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if sdk-version.txt has not changed"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sdk-version.txt Change
        id: check_version
        run: |
          git fetch origin
          if [ "${{ github.event.inputs.force_build }}" == 'true' ]; then
            echo "🟠 Force build triggered. Continuing..."
          elif git diff --quiet HEAD^ HEAD -- sdk-version.txt; then
            echo "❌ No changes in sdk-version.txt. Exiting..."
            exit 1
          fi
          echo "✅ sdk-version.txt has changed. Continuing..."

      - name: Install dependencies
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          swift --version
          echo "✅ Dependencies installed successfully"

      - name: Create or Update Draft Release
        run: |
          VERSION=$(cat sdk-version.txt)  # Read the version from sdk-version.txt
          TAG="$VERSION"
          RELEASE_NAME="CleverTap iOS SDK $VERSION"
          RELEASE_NOTES="CleverTap iOS SDK $VERSION Release Notes"

          # Check if the tag exists
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          # Check if a draft release already exists
          EXISTING_RELEASE=$(gh release list --json name,tagName --jq ".[] | select(.tagName == \"$TAG\") | .tagName")

          if [ -n "$EXISTING_RELEASE" ]; then
            echo "🟠 Draft release found. Skipping asset upload as S3 is used."
          else
            echo "🟢 No existing draft found. Creating new one..."
            gh release create "$TAG" \
              --title "$RELEASE_NAME" \
              --notes "$RELEASE_NOTES" \
              --draft
            echo "✅ New draft release created."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Notify the Bearded Robot test app (CleverTap/CT-Apps) that a new core
      # SDK version has been cut, so it can open a version-bump PR.
      # NOTE: this fires when the draft release / tag is created. If the pod is
      # only resolvable from CleverTap/podspecs at a later publish step, move
      # this step (or add a `release: [published]` trigger) to that point so the
      # CT-Apps `pod update` can find the version. Until then the CT-Apps side
      # can be re-run manually via workflow_dispatch.
      - name: Dispatch core-sdk-released to CT-Apps
        env:
          GH_TOKEN: ${{ secrets.CT_APPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CT_APPS_DISPATCH_TOKEN is not set. Add a PAT with 'repo' scope on CleverTap/CT-Apps as a repo secret."
            exit 1
          fi
          VERSION=$(cat sdk-version.txt)
          echo "📣 Notifying CT-Apps: ios core $VERSION released"
          PAYLOAD=$(printf '{"event_type":"core-sdk-released","client_payload":{"platform":"ios","version":"%s"}}' "$VERSION")
          echo "$PAYLOAD" | gh api repos/CleverTap/CT-Apps/dispatches --method POST --input -
          echo "✅ Dispatch sent to CleverTap/CT-Apps."
